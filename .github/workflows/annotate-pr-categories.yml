name: Annotate PR Categories

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'blogs.json'

permissions:
  contents: read
  pull-requests: write

jobs:
  annotate:
    name: Annotate Blog Entry Changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Save HEAD version
        run: cp blogs.json /tmp/blogs-head.json

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Restore HEAD version
        run: cp /tmp/blogs-head.json blogs-head.json

      - name: Analyze Changes
        id: analyze
        run: |
          node .github/scripts/analyze-blog-changes.js > output.txt
          if grep -q "NO_CHANGES=true" output.txt; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            # Extract comment between EOF markers
            sed -n '/COMMENT<<EOF/,/^EOF$/p' output.txt | sed '1d;$d' > comment.txt
          fi

      - name: Post PR Comment
        if: steps.analyze.outputs.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const comment = fs.readFileSync('comment.txt', 'utf8');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('📝 Blog Entry Changes')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: comment
              });
              console.log('Updated existing comment');
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });
              console.log('Created new comment');
            }
